name: Build and Publish HyperBEAM Docker Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Commit SHA or tag (from HyperBEAM repo) to build the image from.'
        required: true
      flavor:
        description: 'Image flavor: mainnet (lua compute) or the deprecated genesis_wasm build.'
        type: choice
        default: mainnet
        options:
          - mainnet
          - genesis_wasm
env:
  IMAGE_NAME: hyperbeam-docker

jobs:
  push:
    runs-on: self-hosted
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Build image
        run: |
          if [ "${{ github.event.inputs.flavor }}" == "genesis_wasm" ]; then
            CONTEXT=legacy
            DOCKERFILE=legacy/genesis_wasm.Dockerfile
          else
            CONTEXT=.
            DOCKERFILE=Dockerfile
          fi
          docker build $CONTEXT \
            --file $DOCKERFILE \
            --tag $IMAGE_NAME \
            --label "runnumber=${GITHUB_RUN_ID}" \
            --build-arg VERSION=${{ github.event.inputs.version }}

      - name: Log in to registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $ --password-stdin

      - name: Push image
        run: |
          IMAGE_ID=$CONTAINER_REGISTRY_ADDR/${{ github.repository_owner }}/$IMAGE_NAME
          GHCR_IMAGE_ID=ghcr.io/${{ github.repository_owner }}/$IMAGE_NAME
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          GHCR_IMAGE_ID=$(echo $GHCR_IMAGE_ID | tr '[A-Z]' '[a-z]')
          VERSION=$(echo "${{ github.event.inputs.version }}" | sed -e 's,.*/\(.*\),\1,')
          [[ "${{ github.event.inputs.version }}" == "refs/tags/"* ]] && VERSION=$(echo $VERSION | sed -e 's/^v//')
          # Use Docker `latest` tag convention
          [ "$VERSION" == "main" ] && VERSION=stage
          # Deprecated genesis_wasm builds get a suffixed tag
          [ "${{ github.event.inputs.flavor }}" == "genesis_wasm" ] && VERSION=${VERSION}-genesis-wasm
          echo IMAGE_ID=$IMAGE_ID
          echo GHCR_IMAGE_ID=$GHCR_IMAGE_ID
          echo VERSION=$VERSION
          docker tag $IMAGE_NAME $IMAGE_ID:${VERSION}
          docker tag $IMAGE_NAME $GHCR_IMAGE_ID:${VERSION}
          docker push $IMAGE_ID:${VERSION}
          docker push $GHCR_IMAGE_ID:${VERSION}
